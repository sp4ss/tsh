[package]
name = "tsh"
version = "0.1.0"
edition = "2021"




[dependencies]
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls", "ring"] }
rcgen = "0.13"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util", "net", "signal"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1.0"
sha2 = "0.10"
hex = "0.4"
