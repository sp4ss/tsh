name: Mirror Codeberg SHA-256 to GitHub SHA-1

on:
  schedule:
    - cron: "0 0 1 * *" 
  workflow_dispatch:    # Allows manual runs anytime

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: CVT SHA-256 repo to SHA-1 and push to GitHub
        run: |
          git clone --mirror https://codeberg.org/spass/tsh.git src-sha256.git
          git init --bare --object-format=sha1 dst-sha1.git

          git -C src-sha256.git fast-export --all --signed-tags=strip | git -C dst-sha1.git fast-import

          git -C dst-sha1.git push --force --prune \
            "https://x-access-token:${{ secrets.PAT_CODEBERG }}@github.com/sp4s-s/tsh.git" \
            "refs/heads/*:refs/heads/*" \
            "refs/tags/*:refs/tags/*"
